<!DOCTYPE html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT Relay Control</title>
    <style>
      :root {
        --bg: #0b1220;
        --bg-elevated: #121a2b;
        --card: #162033;
        --card-border: #243247;
        --text: #e8eef8;
        --muted: #8ea0b8;
        --accent: #3b9eff;
        --accent-hover: #5cb0ff;
        --on: #22c55e;
        --on-bg: rgba(34, 197, 94, 0.14);
        --off: #ef4444;
        --off-bg: rgba(239, 68, 68, 0.14);
        --warning: #f59e0b;
        --warning-bg: rgba(245, 158, 11, 0.14);
        --radius: 16px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: var(--font);
        background:
          radial-gradient(circle at top right, rgba(59, 158, 255, 0.12), transparent 28%),
          radial-gradient(circle at bottom left, rgba(34, 197, 94, 0.08), transparent 30%),
          var(--bg);
        color: var(--text);
        padding: 1.25rem;
        line-height: 1.5;
      }

      .app {
        width: min(720px, 100%);
        margin: 0 auto;
      }

      header {
        margin-bottom: 1.25rem;
      }

      header h1 {
        font-size: clamp(1.5rem, 4vw, 2rem);
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      header p {
        color: var(--muted);
        margin-top: 0.25rem;
        font-size: 0.95rem;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1.25rem;
        margin-bottom: 1rem;
      }

      .card h2 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-bottom: 1rem;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }

      label {
        font-size: 0.875rem;
        color: var(--muted);
      }

      input {
        width: 100%;
        padding: 0.85rem 1rem;
        border-radius: 12px;
        border: 1px solid var(--card-border);
        background: var(--bg-elevated);
        color: var(--text);
        font: inherit;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59, 158, 255, 0.18);
      }

      .status-grid {
        display: grid;
        gap: 1rem;
      }

      .relay-badge {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.1rem 1.2rem;
        border-radius: 14px;
        border: 1px solid transparent;
        transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
      }

      .relay-badge.on {
        background: var(--on-bg);
        border-color: rgba(34, 197, 94, 0.45);
        color: var(--on);
      }

      .relay-badge.off {
        background: var(--off-bg);
        border-color: rgba(239, 68, 68, 0.45);
        color: var(--off);
      }

      .relay-badge .label {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .relay-badge .value {
        font-size: clamp(1.4rem, 4vw, 1.8rem);
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .timer-panel {
        display: none;
        padding: 1rem 1.15rem;
        border-radius: 14px;
        background: var(--warning-bg);
        border: 1px solid rgba(245, 158, 11, 0.4);
      }

      .timer-panel.active {
        display: block;
      }

      .timer-panel .title {
        color: var(--warning);
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }

      .timer-panel .seconds {
        font-size: 2rem;
        font-weight: 800;
        color: var(--text);
      }

      .timer-panel .seconds span {
        font-size: 1rem;
        font-weight: 600;
        color: var(--muted);
        margin-left: 0.25rem;
      }

      .connection {
        margin-top: 0.9rem;
        font-size: 0.85rem;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }

      .dot.online {
        background: var(--on);
      }

      .dot.offline {
        background: var(--off);
      }

      .controls {
        display: grid;
        gap: 1rem;
      }

      .btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 0.95rem 1.1rem;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.12s ease, opacity 0.2s ease, background 0.2s ease;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-toggle {
        background: linear-gradient(135deg, #2563eb, #3b9eff);
        color: white;
      }

      .btn-toggle:hover:not(:disabled) {
        background: linear-gradient(135deg, #1d4ed8, var(--accent-hover));
      }

      .timer-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.75rem;
        align-items: end;
      }

      .btn-timer {
        background: #243044;
        color: var(--text);
        border: 1px solid var(--card-border);
        white-space: nowrap;
        min-width: 120px;
      }

      .btn-timer:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }

      .programs-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.85rem;
      }

      @media (min-width: 640px) {
        .programs-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .program-btn {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.35rem;
        width: 100%;
        text-align: left;
        padding: 1.1rem 1.15rem;
        border-radius: 14px;
        border: 2px solid var(--card-border);
        background: var(--bg-elevated);
        color: var(--text);
        font: inherit;
        cursor: pointer;
        transition: border-color 0.2s ease, box-shadow 0.2s ease,
          transform 0.12s ease, background 0.2s ease;
      }

      .program-btn:hover:not(:disabled) {
        border-color: var(--accent);
        transform: translateY(-1px);
      }

      .program-btn:active:not(:disabled) {
        transform: scale(0.98);
      }

      .program-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .program-btn.active {
        border-color: var(--on);
        background: var(--on-bg);
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2),
          0 0 24px rgba(34, 197, 94, 0.18);
      }

      .program-btn .program-title {
        font-size: 1.05rem;
        font-weight: 800;
      }

      .program-btn .program-desc {
        font-size: 0.82rem;
        color: var(--muted);
        font-weight: 500;
      }

      .program-btn.active .program-desc {
        color: rgba(232, 238, 248, 0.85);
      }

      .log-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      .log-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.5rem 1rem;
        padding: 0.85rem 1rem;
        border-radius: 12px;
        background: var(--bg-elevated);
        border: 1px solid var(--card-border);
      }

      .log-item .event {
        font-weight: 700;
      }

      .log-item .event.on {
        color: var(--on);
      }

      .log-item .event.off {
        color: var(--off);
      }

      .log-item .event.timer {
        color: var(--warning);
      }

      .log-item .meta {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .log-item .duration {
        grid-column: 1 / -1;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .log-empty,
      .log-error {
        color: var(--muted);
        font-size: 0.9rem;
        padding: 0.5rem 0;
      }

      .log-error {
        color: var(--off);
      }

      footer {
        margin-top: 1.5rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.8rem;
      }

      @media (max-width: 560px) {
        body {
          padding: 1rem;
        }

        .card {
          padding: 1rem;
        }

        .timer-row {
          grid-template-columns: 1fr;
        }

        .btn-timer {
          width: 100%;
        }

        .log-item {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>IoT Relay Control</h1>
        <p>Kontrola preko Firebase Cloud-a</p>
      </header>

      <section class="card">
        <h2>Status</h2>
        <div class="status-grid">
          <div id="relayBadge" class="relay-badge off" aria-live="polite">
            <div>
              <div class="label">Stanje releja</div>
              <div id="relayStatus" class="value">ISKLJUČEN</div>
            </div>
          </div>

          <div id="timerPanel" class="timer-panel" aria-live="polite">
            <div class="title">Aktivan tajmer</div>
            <div class="seconds">
              <span id="timerSeconds">0</span><span>sekundi preostalo</span>
            </div>
          </div>
        </div>

        <div class="connection">
          <span id="connDot" class="dot offline"></span>
          <span id="connText">Povezivanje na Firebase…</span>
        </div>
      </section>

      <section class="card">
        <h2>Kontrole</h2>
        <div class="controls">
          <button id="toggleBtn" class="btn btn-toggle" type="button">
            Toggle ON / OFF
          </button>

          <div class="timer-row">
            <div class="field">
              <label for="timerInput">Trajanje tajmera (sekunde)</label>
              <input id="timerInput" type="number" min="1" step="1" value="10" />
            </div>
            <button id="startTimerBtn" class="btn btn-timer" type="button">
              Pokreni
            </button>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Programi Navodnjavanja</h2>
        <div class="programs-grid">
          <button
            class="program-btn"
            type="button"
            data-seconds="10"
            data-name="Orošavanje"
            data-log="Aktiviran program: Orošavanje (10s)"
          >
            <span class="program-title">🌱 Orošavanje (10s)</span>
            <span class="program-desc">Za mlade biljke</span>
          </button>

          <button
            class="program-btn"
            type="button"
            data-seconds="30"
            data-name="Standardno"
            data-log="Aktiviran program: Standardno navodnjavanje (30s)"
          >
            <span class="program-title">🪴 Standardno (30s)</span>
            <span class="program-desc">Za travnjak i baštu</span>
          </button>

          <button
            class="program-btn"
            type="button"
            data-seconds="60"
            data-name="Dubinsko"
            data-log="Aktiviran program: Dubinsko navodnjavanje (60s)"
          >
            <span class="program-title">🌳 Dubinsko (60s)</span>
            <span class="program-desc">Za grmlje i drveće</span>
          </button>
        </div>
      </section>

      <section class="card">
        <h2>Istorija Aktivnosti (Firebase Log)</h2>
        <ul id="activityLog" class="log-list">
          <li class="log-empty">Učitavanje logova…</li>
        </ul>
      </section>

      <footer>ESP32 IoT Control Panel — Firebase</footer>
    </div>

    <script>
      const FIREBASE_AUTH = "9djHDyc87KmRpkPnJ2E9ydmwZtAbNouDBrZu0aZo";
      const FIREBASE_BASE =
        "https://sistemzalivanje-default-rtdb.europe-west1.firebasedatabase.app";
      const FIREBASE_COMMAND_URL =
        FIREBASE_BASE + "/command.json?auth=" + encodeURIComponent(FIREBASE_AUTH);
      const FIREBASE_STATUS_URL =
        FIREBASE_BASE + "/status.json?auth=" + encodeURIComponent(FIREBASE_AUTH);
      const FIREBASE_LOGS_URL =
        FIREBASE_BASE + "/logs.json?auth=" + encodeURIComponent(FIREBASE_AUTH);

      const relayBadge = document.getElementById("relayBadge");
      const relayStatus = document.getElementById("relayStatus");
      const timerPanel = document.getElementById("timerPanel");
      const timerSeconds = document.getElementById("timerSeconds");
      const connDot = document.getElementById("connDot");
      const connText = document.getElementById("connText");
      const toggleBtn = document.getElementById("toggleBtn");
      const timerInput = document.getElementById("timerInput");
      const startTimerBtn = document.getElementById("startTimerBtn");
      const activityLog = document.getElementById("activityLog");
      const programButtons = document.querySelectorAll(".program-btn");

      let activeProgramSeconds = null;
      let localTimerInterval = null;
      let localSecondsLeft = 0;

      function setConnection(online, message) {
        connDot.classList.toggle("online", online);
        connDot.classList.toggle("offline", !online);
        connText.textContent = message;
      }

      function setRelayUi(isOn) {
        relayBadge.classList.toggle("on", isOn);
        relayBadge.classList.toggle("off", !isOn);
        relayStatus.textContent = isOn ? "UKLJUČEN" : "ISKLJUČEN";
      }

      function setTimerUi(secondsLeft, visible) {
        if (visible && secondsLeft > 0) {
          timerPanel.classList.add("active");
          timerSeconds.textContent = secondsLeft;
        } else {
          timerPanel.classList.remove("active");
          timerSeconds.textContent = "0";
        }
      }

      function updateProgramHighlight(timerActive, secondsLeft) {
        programButtons.forEach(function (btn) {
          const programSeconds = Number(btn.dataset.seconds);
          const isActive =
            timerActive &&
            activeProgramSeconds !== null &&
            programSeconds === activeProgramSeconds &&
            secondsLeft > 0;

          btn.classList.toggle("active", isActive);
        });

        if (!timerActive || secondsLeft <= 0) {
          activeProgramSeconds = null;
          programButtons.forEach(function (btn) {
            btn.classList.remove("active");
          });
        }
      }

      function stopLocalTimer() {
        if (localTimerInterval !== null) {
          clearInterval(localTimerInterval);
          localTimerInterval = null;
        }
        localSecondsLeft = 0;
      }

      function finishLocalTimer() {
        stopLocalTimer();
        setRelayUi(false);
        setTimerUi(0, false);
        updateProgramHighlight(false, 0);
      }

      function startLocalTimer(seconds) {
        stopLocalTimer();

        localSecondsLeft = Math.max(1, Number(seconds) || 1);
        setRelayUi(true);
        setTimerUi(localSecondsLeft, true);
        updateProgramHighlight(true, localSecondsLeft);

        localTimerInterval = setInterval(function () {
          localSecondsLeft -= 1;

          if (localSecondsLeft > 0) {
            setTimerUi(localSecondsLeft, true);
            updateProgramHighlight(true, localSecondsLeft);
            return;
          }

          // Tajmer stigao do 0 — UI automatski na ISKLJUČENO
          finishLocalTimer();
        }, 1000);
      }

      function isLocalTimerRunning() {
        return localTimerInterval !== null && localSecondsLeft > 0;
      }

      function isFirebaseTimerActive(data) {
        if (!data || typeof data !== "object") {
          return false;
        }

        const secondsLeft = Number(data.timerSeconds) || 0;
        return (
          data.timerActive === true ||
          data.timerActive === "true" ||
          secondsLeft > 0
        );
      }

      function renderStatus(data) {
        if (!data || typeof data !== "object") {
          return;
        }

        const firebaseTimerActive = isFirebaseTimerActive(data);

        // Ako Firebase više ne prijavljuje aktivan tajmer, prekini lokalni timer
        if (!firebaseTimerActive && isLocalTimerRunning()) {
          finishLocalTimer();
          setRelayUi(Boolean(data.relay));
          return;
        }

        // Dok lokalni tajmer radi, ne pregazi lokalno odbrojavanje Firebase sekundama
        if (isLocalTimerRunning()) {
          setRelayUi(true);
          setTimerUi(localSecondsLeft, true);
          updateProgramHighlight(true, localSecondsLeft);
          return;
        }

        const isOn = Boolean(data.relay);
        const secondsLeft = Number(data.timerSeconds) || 0;

        setRelayUi(isOn);
        setTimerUi(secondsLeft, firebaseTimerActive && secondsLeft > 0);
        updateProgramHighlight(firebaseTimerActive, secondsLeft);
      }

      function renderActivityLog(logs) {
        activityLog.innerHTML = "";

        if (!logs.length) {
          const empty = document.createElement("li");
          empty.className = "log-empty";
          empty.textContent = "Nema zapisa u Firebase logu.";
          activityLog.appendChild(empty);
          return;
        }

        logs.forEach(function (entry) {
          const li = document.createElement("li");
          li.className = "log-item";

          const eventEl = document.createElement("div");
          eventEl.className = "event";
          eventEl.textContent = entry.event || "Nepoznat događaj";

          if (entry.event === "Uključeno") {
            eventEl.classList.add("on");
          } else if (entry.event === "Isključeno") {
            eventEl.classList.add("off");
          } else if (
            entry.event === "Tajmer pokrenut" ||
            (entry.event && entry.event.indexOf("Aktiviran program") === 0)
          ) {
            eventEl.classList.add("timer");
          }

          const metaEl = document.createElement("div");
          metaEl.className = "meta";
          metaEl.textContent = entry.timestamp || "";

          li.appendChild(eventEl);
          li.appendChild(metaEl);

          if (entry.duration !== undefined && entry.duration !== null) {
            const durationEl = document.createElement("div");
            durationEl.className = "duration";
            durationEl.textContent = "Trajanje: " + entry.duration;
            li.appendChild(durationEl);
          }

          activityLog.appendChild(li);
        });
      }

      async function sendCommand(commandValue) {
        const response = await fetch(FIREBASE_COMMAND_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(commandValue),
        });

        if (!response.ok) {
          throw new Error("Firebase command HTTP " + response.status);
        }
      }

      async function sendLogToFirebase(eventText, duration = null) {
        const logData = {
          timestamp: new Date().toLocaleString("bs-BA"),
          event: eventText,
          duration: duration ? `${duration}s` : "N/A",
        };

        try {
          await fetch(FIREBASE_LOGS_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(logData),
          });
          fetchFirebaseLogs();
        } catch (err) {
          console.error("Firebase greška:", err);
        }
      }

      async function fetchFirebaseLogs() {
        try {
          const response = await fetch(FIREBASE_LOGS_URL, {
            method: "GET",
            cache: "no-store",
          });

          if (!response.ok) {
            throw new Error("Firebase GET HTTP " + response.status);
          }

          const data = await response.json();
          const logs = [];

          if (data && typeof data === "object") {
            Object.keys(data).forEach(function (key) {
              logs.push(Object.assign({ id: key }, data[key]));
            });
          }

          const latest = logs.slice(-5).reverse();
          renderActivityLog(latest);
        } catch (error) {
          console.error("fetchFirebaseLogs error:", error);
          activityLog.innerHTML =
            '<li class="log-error">Neuspješno učitavanje Firebase logova.</li>';
        }
      }

      async function fetchStatus() {
        try {
          const response = await fetch(FIREBASE_STATUS_URL, {
            method: "GET",
            cache: "no-store",
          });

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          const data = await response.json();
          renderStatus(data);
          setConnection(true, "Povezano na Firebase");
          return data;
        } catch (error) {
          setConnection(false, "Nema veze sa Firebase");
          console.error("fetchStatus error:", error);
          return null;
        }
      }

      async function toggleRelay() {
        toggleBtn.disabled = true;

        try {
          // Ručni toggle prekida lokalni tajmer
          stopLocalTimer();
          activeProgramSeconds = null;
          updateProgramHighlight(false, 0);

          await sendCommand("TOGGLE");
          await fetchStatus();

          const isOn = relayBadge.classList.contains("on");
          await sendLogToFirebase(isOn ? "Uključeno" : "Isključeno");
        } catch (error) {
          setConnection(false, "Greška pri toggle komandi");
          console.error("toggleRelay error:", error);
        } finally {
          toggleBtn.disabled = false;
        }
      }

      async function startTimer() {
        const seconds = Math.max(1, parseInt(timerInput.value, 10) || 10);
        timerInput.value = seconds;
        startTimerBtn.disabled = true;

        try {
          activeProgramSeconds = null;
          await sendCommand("TIMER_" + seconds);
          startLocalTimer(seconds);
          await sendLogToFirebase("Tajmer pokrenut", seconds);
        } catch (error) {
          stopLocalTimer();
          setConnection(false, "Greška pri pokretanju tajmera");
          console.error("startTimer error:", error);
        } finally {
          startTimerBtn.disabled = false;
        }
      }

      async function startProgram(button) {
        const seconds = Number(button.dataset.seconds);
        const logText = button.dataset.log;

        programButtons.forEach(function (btn) {
          btn.disabled = true;
        });

        try {
          activeProgramSeconds = seconds;
          await sendCommand("TIMER_" + seconds);
          startLocalTimer(seconds);
          await sendLogToFirebase(logText, seconds);
        } catch (error) {
          stopLocalTimer();
          activeProgramSeconds = null;
          updateProgramHighlight(false, 0);
          setConnection(false, "Greška pri pokretanju programa");
          console.error("startProgram error:", error);
        } finally {
          programButtons.forEach(function (btn) {
            btn.disabled = false;
          });
        }
      }

      toggleBtn.addEventListener("click", toggleRelay);
      startTimerBtn.addEventListener("click", startTimer);

      programButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          startProgram(button);
        });
      });

      fetchStatus();
      fetchFirebaseLogs();
      setInterval(fetchStatus, 2000);
    </script>
  </body>
</html>
